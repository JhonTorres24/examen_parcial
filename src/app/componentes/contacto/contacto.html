<section id="contacto" class="py-5 bg-light">
  <div class="container">
    <div class="text-center mb-5">
      <h2 class="text-primary fw-bold">Contáctanos</h2>
      <p class="text-muted">Estamos aquí para resolver tus dudas</p>
    </div>

    <div class="row g-4 justify-content-center">
      <div class="col-lg-5">
        <div class="card border-0 shadow-sm h-100">
          <div class="card-body p-4">
            <h5 class="fw-bold mb-3">📞 Información de contacto</h5>
            <ul class="list-unstyled">
              <li class="mb-3 d-flex gap-3">
                <span class="fs-4">📍</span>
                <div>
                  <strong class="d-block">Dirección</strong>
                  <small class="text-muted">Av. San Carlos 1980, Huancayo</small>
                </div>
              </li>
              <li class="mb-3 d-flex gap-3">
                <span class="fs-4">📞</span>
                <div>
                  <strong class="d-block">Teléfono</strong>
                  <small class="text-muted">(064) 481-430</small>
                </div>
              </li>
              <li class="mb-3 d-flex gap-3">
                <span class="fs-4">✉️</span>
                <div>
                  <strong class="d-block">Email</strong>
                  <small class="text-muted">informes@continental.edu.pe</small>
                </div>
              </li>
              <li class="d-flex gap-3">
                <span class="fs-4">🕐</span>
                <div>
                  <strong class="d-block">Horario</strong>
                  <small class="text-muted">Lun - Sáb: 8:00 - 20:00</small>
                </div>
              </li>
            </ul>
          </div>
        </div>
      </div>

      <div class="col-lg-7">
        <div class="card border-0 shadow-sm h-100">
          <div class="card-body p-4">
            <h5 class="fw-bold mb-3">✍️ Envíanos un mensaje</h5>
            <form>
              <div class="row g-3">
                <div class="col-md-6">
                  <label class="form-label small">Nombre completo</label>
                  <input type="text" class="form-control" placeholder="Tu nombre">
                </div>
                <div class="col-md-6">
                  <label class="form-label small">Email</label>
                  <input type="email" class="form-control" placeholder="tu@email.com">
                </div>
                <div class="col-12">
                  <label class="form-label small">Asunto</label>
                  <input type="text" class="form-control" placeholder="¿En qué podemos ayudarte?">
                </div>
                <div class="col-12">
                  <label class="form-label small">Mensaje</label>
                  <textarea class="form-control" rows="4" placeholder="Escribe tu mensaje..."></textarea>
                </div>
                <div class="col-12">
                  <button type="submit" class="btn btn-primary px-4">Enviar mensaje</button>
                </div>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
